
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Online Examination System</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<header class="header">

    <div class="logo">
        Online Exam
    </div>

    <div class="timer-box">

        <span>Online Examination</span>

    </div>

</header>


<main class="container">

    <section class="card student-card">

        <h1>
            Student Examination Form
        </h1>

        <p class="subtitle">
            Enter your details before starting the examination.
        </p>


        <form id="studentForm">

            <div class="form-row">

                <div class="form-group">

                    <label for="studentName">
                        Student Name
                    </label>

                    <input
                        type="text"
                        id="studentName"
                        placeholder="Enter student name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="rollNumber">
                        Roll Number
                    </label>

                    <input
                        type="text"
                        id="rollNumber"
                        placeholder="Enter roll number"
                        required
                    >

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email address"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="subject">
                        Subject
                    </label>

                    <select id="subject" required>

                        <option value="">
                            Select Subject
                        </option>

                        <option value="JavaScript">
                            JavaScript
                        </option>

                        <option value="ServiceNow">
                            ServiceNow
                        </option>

                        <option value="HTML">
                            HTML
                        </option>

                        <option value="CSS">
                            CSS
                        </option>

                    </select>

                </div>

            </div>


            <button
                type="submit"
                class="start-btn">

                Start Examination

            </button>

        </form>

    </section>

</main>


<script src="script.js"></script>

</body>

</html>
